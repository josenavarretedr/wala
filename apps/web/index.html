<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Básico -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WALA | Claridad financiera y operativa para tu negocio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="WALA combina software simple y una metodología práctica para darte claridad financiera y operativa en tu negocio. Ordena tus cuentas, controla tu inventario y decide con números reales en Latinoamérica."
    />
    <meta
      name="keywords"
      content="wala, claridad financiera y operativa, app para negocios, control de ingresos y gastos, flujo de caja, inventario, finanzas, negocios en Latinoamérica, método wala"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#E35336" />

    <!-- Favicons / PWA (sirve en dev y prod) -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon_io/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      href="/assets/favicon_io/apple-touch-icon.png"
    />
    <link rel="manifest" href="/assets/favicon_io/site.webmanifest" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="WALA | Claridad financiera y operativa para tu negocio"
    />
    <meta
      property="og:description"
      content="Ordena tus finanzas, controla tu inventario y decide con datos reales. WALA integra software simple y metodología práctica para tu negocio en Latinoamérica."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WALA" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:image" content="/assets/og-image.jpg" />
    <meta property="og:url" content="https://wala-lat.web.app/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="WALA | Claridad financiera y operativa para tu negocio"
    />
    <meta
      name="twitter:description"
      content="Claridad financiera y operativa para tu negocio: flujo de caja, inventario, costos y acompañamiento práctico en Latinoamérica."
    />
    <meta name="twitter:image" content="/assets/og-image.jpg" />
    <meta name="twitter:creator" content="@wala_lat" />

    <!-- JSON-LD (SoftwareApplication) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "WALA",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "category": "Freemium"
        },
        "description": "WALA combina software y metodología de claridad financiera y operativa para ayudar a negocios en Latinoamérica a ordenar sus finanzas, controlar inventario y tomar mejores decisiones.",
        "image": "/assets/og-image.jpg",
        "url": "https://wala-lat.web.app/",
        "publisher": {
          "@type": "Organization",
          "name": "WALA LAT",
          "logo": {
            "@type": "ImageObject",
            "url": "/assets/favicon_io/android-chrome-192x192.png"
          }
        },
        "inLanguage": "es-PE",
        "keywords": "claridad financiera y operativa, finanzas, gestión de negocio, flujo de caja, inventario, negocios en Latinoamérica"
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- Vite mantiene esta línea en dev y la reemplaza en build -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
